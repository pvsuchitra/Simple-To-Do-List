<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content=""width=device-width,initial-scale=1.0">
        <title>To-Do with Flask</title>
    </head>
    <body>
        <h1>Task Tracker</h1>
            <!--Task List --> 
            <table>
                <tr>
                    <th>Task</th>
                    <th>Status</th>
                    
                    <th>Priority</th>
                    <th>Actions</th>
                </tr>
                {% for task in tasks %}
                <tr>
                    <td>{{task[0]}}</td>
                    <td>{{task[1]}}</td>
                    <td>{{task[2]}}</td>
                    <td><a href="{{url_for('completed_tasks', task_id=loop.index0)}}">✅</a>
                        <a href="{{url_for('delete_task', task_id=loop.index0)}}">❌</a></td>
                </tr>
                {% endfor %}
            </table>
            <form action="{{ url_for('add_task')}}" method ="post">
                <input type="text" name="task_name" required>
                <select id="task_priority" name="task_priority">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        
    </body>
</html>
